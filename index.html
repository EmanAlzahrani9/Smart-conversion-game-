<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>التحويل الذكي — مختبر الفيزياء</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
          integrity="sha512-9lN+N4v1aGdXyCmy2S4PT1nWZ1oQk7Gg4ZQdW5Wk5b0nHkQJ2w9m3J1UO4f8QZJm9Z6lW0v8Yk4r8E3sW7Kq3g=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
    body{margin:0;padding:0;font-family:"Cairo",sans-serif;text-align:center;position:relative;overflow-x:hidden;background:#0a0f1f;color:white}
    .card{background:#0f1833;max-width:600px;margin:50px auto;padding:20px;border-radius:15px}
    input, select{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:none;background:#101833;color:white;font-size:16px}
    button{padding:12px 18px;margin:6px;font-size:18px;border-radius:10px;border:none;cursor:pointer}
    .primary{background:#3ddc97;color:#03140c}
    .ghost{background:transparent;border:1px solid #9ab0ff;color:white}
    #question-text{font-weight:bold;font-size:22px;margin-bottom:20px}
    .screen{display:none;padding:10px;min-height:100vh}
    .screen.active{display:block}
    #topPlayers,#topScores{margin-top:20px;background:rgba(0,0,0,0.3);padding:12px;border-radius:12px;text-align:right}
    #topPlayers-list li,#topScores-list li{margin:4px 0;font-weight:bold}
  </style>
</head>
<body>

<!-- شاشة البداية -->
<section id="start-screen" class="screen active">
  <div class="card">
    <h1>التحويل الذكي</h1>
    <p class="subtitle">مغامرة في مختبر الفيزياء</p>
    <label>اسم الطالب/ة:</label>
    <input id="student-name" type="text" placeholder="اكتب اسمك هنا">

    <label>اختر الوحدة:</label>
    <select id="unit-select">
      <option value="m">المتر (m)</option>
      <option value="g">الجرام (g)</option>
      <option value="J">الجول (J)</option>
      <option value="W">الواط (W)</option>
    </select>

    <label>مجموعة البادئات:</label>
    <select id="range-select">
      <option value="common">الشائعة</option>
      <option value="extended">الممتدة</option>
      <option value="full">الكاملة</option>
    </select>

    <label>عدد الأسئلة في المستوى:</label>
    <input id="questions-per-level" type="number" value="5" min="3" max="12">

    <button id="btn-start" class="primary">ابدأ اللعبة</button>
  </div>
</section>

<!-- شاشة اللعبة -->
<section id="game-screen" class="screen">
  <div class="card">
    <h2 id="question-text">...</h2>
    <div id="choices"></div>
    <div id="feedback"></div>
    <p>النقاط: <span id="score">0</span></p>
    <p>المستوى: <span id="level">1</span></p>
    <p>الوقت: <span id="time">60</span>s</p>
    <button id="btn-next-level" class="primary">المستوى التالي</button>
    <button id="btn-restart" class="ghost">إعادة اللعب</button>
  </div>
</section>

<!-- شاشة النهاية -->
<section id="end-screen" class="screen">
  <div class="card">
    <h2 id="end-title">🎉 انتهت اللعبة!</h2>
    <p id="end-summary"></p>

    <label>اسم الطالب/ة:</label>
    <input id="student-name-end" type="text" placeholder="اكتب اسمك هنا">

    <button id="btn-certificate" class="primary">📄 تحميل الشهادة</button>

    <div id="topPlayers">
      <h3>🏆 أفضل 20 لاعب</h3>
      <ol id="topPlayers-list"></ol>
    </div>

    

    <button id="btn-restart-end" class="ghost">إعادة اللعب</button>
  </div>
</section>

<script>
/*-------------------- البيانات الأساسية --------------------*/
let Game = {score:0, level:1};
const ui = {
  studentNameStart: document.getElementById('student-name'),
  studentNameEnd: document.getElementById('student-name-end'),
  score: document.getElementById('score'),
  level: document.getElementById('level'),
  questionText: document.getElementById('question-text'),
  choices: document.getElementById('choices'),
  feedback: document.getElementById('feedback'),
  endTitle: document.getElementById('end-title'),
  endSummary: document.getElementById('end-summary')
};

function swapScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(name).classList.add('active');
}

/*-------------------- التوب 20 --------------------*/
function saveScore(name, score){
  let scores = JSON.parse(localStorage.getItem('all_scores')) || [];
  scores.push({name,score});
  localStorage.setItem('all_scores', JSON.stringify(scores));
}

function renderTopScores(){
  const list = document.getElementById('topScores-list');
  let scores = JSON.parse(localStorage.getItem('all_scores')) || [];
  scores.sort((a,b)=>b.score-a.score);
  scores = scores.slice(0,20);
  list.innerHTML='';
  scores.forEach(p=>{
    const li=document.createElement('li');
    li.textContent=`${p.name} - ${p.score} نقطة`;
    list.appendChild(li);
  });
}

function renderTopPlayers(){
  const list = document.getElementById('topPlayers-list');
  let scores = JSON.parse(localStorage.getItem('all_scores')) || [];
  let bestPerPlayer = {};
  scores.forEach(p=>{
    if(!bestPerPlayer[p.name] || p.score>bestPerPlayer[p.name]){
      bestPerPlayer[p.name]=p.score;
    }
  });
  let playersArray=Object.keys(bestPerPlayer).map(name=>({name,score:bestPerPlayer[name]}));
  playersArray.sort((a,b)=>b.score-a.score);
  playersArray=playersArray.slice(0,20);
  list.innerHTML='';
  playersArray.forEach(p=>{
    const li=document.createElement('li');
    li.textContent=`${p.name} - ${p.score} نقطة`;
    list.appendChild(li);
  });
}

/*-------------------- نهاية اللعبة --------------------*/
function endGame(){
  swapScreen('end-screen');
  const playerName = ui.studentNameEnd.value.trim() || "طالب";
  saveScore(playerName, Game.score);
  renderTopScores();
  renderTopPlayers();
}

/*-------------------- أزرار --------------------*/
document.getElementById('btn-start').addEventListener('click',()=>swapScreen('game-screen'));
document.getElementById('btn-restart').addEventListener('click',()=>swapScreen('start-screen'));
document.getElementById('btn-restart-end').addEventListener('click',()=>swapScreen('start-screen'));

/*-------------------- مثال أسئلة --------------------*/
ui.questionText.innerText="حوّل 2 m إلى cm";
ui.choices.innerHTML='';
["200","20","2","0.2"].forEach(opt=>{
  const btn=document.createElement('button');
  btn.textContent=opt;
  btn.onclick=()=>{Game.score+=10; ui.score.innerText=Game.score; endGame();}
  ui.choices.appendChild(btn);
});
</script>

</body>
</html>
